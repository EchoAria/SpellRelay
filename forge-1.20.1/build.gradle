plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = mod_version
group = mod_group_id
base { archivesName = 'spell-relay-1.20.1-forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations.smokeImplementation.extendsFrom(configurations.implementation)
repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'TestLibraries'; url = 'https://repo.maven.apache.org/maven2/' } }
        filter {
            includeGroupByRegex 'org\\.junit.*'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = false
    runs {
        configureEach {
            property 'geckolib.disable_examples', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        client {
            workingDirectory project.file('run-client')
            args '--mixin', 'ironautospell.mixins.json'
            mods { ironautospell { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods { smoketest { source sourceSets.smoke } }
        }
        smoke {
            client true
            workingDirectory project.file('run-smoke')
            args '--username', 'AutoSpellTest', '--server', '127.0.0.1', '--port', '25579', '--width', '1100', '--height', '740'
            args '--mixin', 'ironautospell.mixins.json'
            mods {
                ironautospell { source sourceSets.main }
                smoketest { source sourceSets.smoke }
            }
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('local:irons_spellbooks-1.20.1:3.15.4')
    implementation fg.deobf('local:curios-forge:5.14.1+1.20.1')
    runtimeOnly fg.deobf('local:geckolib-forge-1.20.1:4.8.4')
    runtimeOnly fg.deobf('local:player-animation-lib-forge:1.0.2-rc1+1.20')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version:mod_version }
}
tasks.named('jar') {
    manifest { attributes 'MixinConfigs':'ironautospell.mixins.json' }
    from 'LICENSE', 'TEMPLATE_LICENSE.txt', 'THIRD_PARTY_NOTICES.md'
    finalizedBy 'reobfJar'
}
tasks.register('smokeJar', Jar) {
    from sourceSets.smoke.output
    archiveClassifier = 'test-fixture'
    finalizedBy 'reobfSmokeJar'
}
reobf { smokeJar {} }
